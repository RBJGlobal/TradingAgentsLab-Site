name: Cross-browser checks

# Runs once per release candidate: on a push to the pre-release branch, or by
# hand. Confirms the pinned release files, builds the static site, serves it
# inside the runner and checks key pages in Chromium, Firefox, WebKit and two
# emulated phone profiles on Linux, then in Playwright's WebKit on macOS (this
# is not Safari.app). The macOS job starts only after the Linux job passes.
# Both jobs run only in a private repository, so test logs and screenshots are
# never public. Does not deploy.
on:
  push:
    branches: [pre-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/pin-releases.mjs --check
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

  macos:
    needs: linux
    if: ${{ github.event.repository.private == true }}
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npx playwright test --project=webkit --project=iphone
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-macos-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
