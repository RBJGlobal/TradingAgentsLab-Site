name: Cross-browser checks (macOS WebKit, by hand)

# Started by hand only, before a release. Runs the same checks with
# Playwright's WebKit build on a macOS runner (this is not Safari.app).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-browser-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install webkit
      - run: npx playwright test --project=webkit --project=iphone
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cross-browser-macos-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14
